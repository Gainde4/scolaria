<title>Scolaria</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Concept : un bureau de direction d'école. Barre latérale encre bleu-vert, papier gris-vert clair, chiffres en chasse fixe (reçus, moyennes, FCFA). */
:root {
  --bg: #eef2f1; --surface: #ffffff; --surface2: #f5f8f7; --line: #dbe3e1; --line2: #c8d3d0;
  --fg: #13252b; --mute: #566a70; --faint: #8a9ba0;
  --accent: #0a6a78; --accent-hover: #08545f; --accent-fg: #ffffff; --accent-soft: #d9eef1;
  --brand: #e3a63c; --side-bg: #0e2a30; --side-fg: #b9cfd3; --side-mute: #6f9097; --side-on: #17434c; --side-line: #1c3d44;
  --ok: #166b36; --ok-soft: #dcf2e3; --warn: #8f5600; --warn-soft: #fbebc6; --bad: #a8261d; --bad-soft: #fbe0dc; --info: #1c5aa8; --info-soft: #dce9fa; --mute-soft: #e6ecea;
  --shadow: 0 1px 2px rgba(14, 42, 48, .06), 0 4px 14px rgba(14, 42, 48, .05); --overlay: rgba(8, 24, 28, .55);
  --c0: #dbe9fb; --c1: #fbe3d3; --c2: #dcf1e0; --c3: #f3e0f4; --c4: #fbf0c4; --c5: #d6f1f1; --c6: #ffdede; --c7: #e5e6f7; --cx: #f5f8f7;
  --f-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif; --f-body: 'Figtree', 'Segoe UI', system-ui, sans-serif; --f-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --r: 8px; --r-sm: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a171b; --surface: #112329; --surface2: #162c33; --line: #23404a; --line2: #2f525d; --fg: #e3eeef; --mute: #98adb2; --faint: #6c8389;
    --accent: #4cc2d3; --accent-hover: #75d3e0; --accent-fg: #06262c; --accent-soft: #123f48; --brand: #e8b04e; --side-bg: #071418; --side-fg: #a9c3c8; --side-mute: #5f8189; --side-on: #123942; --side-line: #14303a;
    --ok: #5bd486; --ok-soft: #123a22; --warn: #f0b94d; --warn-soft: #3d2f0c; --bad: #ff8b80; --bad-soft: #471b17; --info: #7db4f5; --info-soft: #14304f; --mute-soft: #1b3239;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4); --overlay: rgba(0, 0, 0, .65);
    --c0: #17324f; --c1: #4a2d1b; --c2: #17402a; --c3: #402a44; --c4: #433a12; --c5: #14403f; --c6: #4a1f1f; --c7: #26284a; --cx: #162c33; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a171b; --surface: #112329; --surface2: #162c33; --line: #23404a; --line2: #2f525d; --fg: #e3eeef; --mute: #98adb2; --faint: #6c8389;
  --accent: #4cc2d3; --accent-hover: #75d3e0; --accent-fg: #06262c; --accent-soft: #123f48; --brand: #e8b04e; --side-bg: #071418; --side-fg: #a9c3c8; --side-mute: #5f8189; --side-on: #123942; --side-line: #14303a;
  --ok: #5bd486; --ok-soft: #123a22; --warn: #f0b94d; --warn-soft: #3d2f0c; --bad: #ff8b80; --bad-soft: #471b17; --info: #7db4f5; --info-soft: #14304f; --mute-soft: #1b3239;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4); --overlay: rgba(0, 0, 0, .65);
  --c0: #17324f; --c1: #4a2d1b; --c2: #17402a; --c3: #402a44; --c4: #433a12; --c5: #14403f; --c6: #4a1f1f; --c7: #26284a; --cx: #162c33; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: auto; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14.5px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--surface); z-index: 60; }
h1, h2, h3, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--f-mono); font-size: .93em; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.muted { color: var(--mute); } .small { font-size: .82rem; } .cap { text-transform: capitalize; } .grow { flex: 1 1 auto; } .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.ic { flex: none; }

/* ---------- Structure ---------- */
.shell { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--side-bg); color: var(--side-fg); position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100vh; display: flex; flex-direction: column; padding-block: 14px 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 10px; overflow: hidden; z-index: 40; }
.brand { display: flex; gap: 11px; align-items: center; padding: 6px 8px 16px; }
.brand strong { font-family: var(--f-display); font-size: 1.28rem; color: #fff; letter-spacing: -.01em; line-height: 1.1; display: block; }
.brand small { display: block; color: var(--side-mute); font-size: .74rem; line-height: 1.25; max-width: 170px; }
.logo-mark { width: 36px; height: 36px; border-radius: 10px; background: var(--brand); color: #1d1405; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 1.25rem; flex: none; }
.side nav { overflow-y: auto; flex: 1; padding-right: 2px; scrollbar-width: thin; scrollbar-color: var(--side-line) transparent; }
.grp { margin-bottom: 12px; } .grp h3 { font-size: .68rem; text-transform: uppercase; letter-spacing: .1em; color: var(--side-mute); font-weight: 600; padding: 4px 10px; }
.nav { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: 0; color: inherit; padding: 7px 10px; border-radius: var(--r-sm); text-align: left; font-size: .9rem; }
.nav:hover { background: rgba(255, 255, 255, .06); color: #fff; }
.nav.on { background: var(--side-on); color: #fff; box-shadow: inset 3px 0 0 var(--brand); }
.nav span { flex: 1; min-width: 0; } .nav b { background: var(--brand); color: #1d1405; font-size: .7rem; border-radius: 99px; padding: 1px 7px; font-family: var(--f-mono); }
.side-foot { display: flex; gap: 10px; align-items: center; padding: 10px 8px 2px; border-top: 1px solid var(--side-line); margin-top: 6px; }
.side-foot strong { color: #fff; font-size: .86rem; display: block; line-height: 1.2; } .side-foot small { color: var(--side-mute); font-size: .74rem; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-family: var(--f-display); flex: none; text-transform: uppercase; }
.avatar.sm { width: 32px; height: 32px; font-size: .8rem; background: var(--side-on); color: #fff; }
.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-height: 52px; }
.crumbs { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: .92rem; } .crumbs span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .crumbs strong { white-space: nowrap; }
.roleswitch { display: flex; align-items: center; gap: 8px; font-size: .78rem; color: var(--mute); } .roleswitch select { padding: 5px 8px; }
.content { padding-block: 22px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); width: 100%; max-width: 1280px; min-width: 0; }
.menu-btn, .scrim { display: none; }

.page-head { display: flex; justify-content: space-between; gap: 14px 24px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 18px; }
.page-head h1 { font-family: var(--f-display); font-size: 1.75rem; line-height: 1.15; letter-spacing: -.02em; font-weight: 700; text-wrap: balance; }
.sub { color: var(--mute); margin-top: 4px; max-width: 68ch; text-wrap: pretty; }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; }
section > * + * { margin-top: 16px; } section > .page-head { margin-bottom: 18px; margin-top: 0; }

/* ---------- Boutons, badges, cartes ---------- */
.btn { display: inline-flex; align-items: center; gap: 7px; background: var(--surface); border: 1px solid var(--line2); border-radius: var(--r-sm); padding: 7px 13px; font-weight: 600; font-size: .88rem; color: var(--fg); line-height: 1.25; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--surface2); border-color: var(--faint); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); } .btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); } .btn.danger.solid { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; } .btn.sm { padding: 4px 10px; font-size: .8rem; } .btn:disabled { opacity: .45; cursor: not-allowed; }
.icon-btn { display: inline-grid; place-items: center; min-width: 32px; height: 32px; background: none; border: 0; border-radius: var(--r-sm); color: var(--mute); padding: 0 6px; }
.icon-btn:hover { background: var(--mute-soft); color: var(--fg); } .icon-btn.danger:hover { background: var(--bad-soft); color: var(--bad); }
.icon-btn.txt { display: inline-flex; align-items: center; gap: 5px; font-size: .8rem; font-weight: 600; color: var(--accent); padding: 0 8px; } .icon-btn.txt:hover { background: var(--accent-soft); color: var(--accent); }
.badge { display: inline-block; font-size: .74rem; font-weight: 600; padding: 2px 8px; border-radius: 99px; line-height: 1.5; white-space: nowrap; background: var(--mute-soft); color: var(--mute); }
.badge.ok { background: var(--ok-soft); color: var(--ok); } .badge.warn { background: var(--warn-soft); color: var(--warn); } .badge.bad { background: var(--bad-soft); color: var(--bad); } .badge.info { background: var(--info-soft); color: var(--info); } .badge.accent { background: var(--accent-soft); color: var(--accent); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card.flush { padding: 0; overflow: hidden; } .card.center { text-align: center; display: grid; gap: 10px; justify-items: center; padding: 34px 20px; } .card.center p { max-width: 52ch; }
.card-title { font-family: var(--f-display); font-size: 1.02rem; font-weight: 650; margin-bottom: 10px; letter-spacing: -.005em; } .card-title small { font-family: var(--f-body); font-weight: 400; color: var(--mute); font-size: .78rem; }
.card-title.sp { margin-top: 20px; } .card-title.pad { padding: 14px 16px 0; } .muted.pad { padding: 4px 16px 16px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); background: var(--surface2); }
.toolbar select, .toolbar input[type=date] { padding: 6px 9px; }
.search { display: flex; align-items: center; gap: 7px; background: var(--surface); border: 1px solid var(--line2); border-radius: var(--r-sm); padding: 0 10px; color: var(--mute); min-width: 200px; } .search input[type=search] { border: 0; background: none; padding: 7px 0; outline: 0; box-shadow: none; width: 100%; min-width: 0; color: var(--fg); border-radius: 0; }
.search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.count { color: var(--mute); font-size: .84rem; display: inline-flex; gap: 12px; flex-wrap: wrap; } .mini { display: inline-flex; gap: 5px; align-items: center; }
.inline-field { display: flex; align-items: center; gap: 7px; } .inline-field label { font-size: .8rem; color: var(--mute); font-weight: 600; }
select, input[type=text], input[type=tel], input[type=email], input[type=date], input[type=time], input[type=number], input[type=search], input:not([type]), textarea { background: var(--surface); border: 1px solid var(--line2); border-radius: var(--r-sm); padding: 8px 10px; min-width: 0; max-width: 100%; }
select:focus, input:focus, textarea:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
input:disabled, select:disabled, textarea:disabled { background: var(--mute-soft); color: var(--mute); }
.check { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; } .check input { width: 17px; height: 17px; accent-color: var(--accent); margin: 0; }
.more { padding: 12px; text-align: center; border-top: 1px solid var(--line); }
.empty { display: grid; justify-items: center; gap: 6px; padding: 46px 20px; text-align: center; color: var(--mute); } .empty strong { color: var(--fg); font-family: var(--f-display); font-size: 1.05rem; }

/* ---------- Tableaux ---------- */
.tablewrap { overflow-x: auto; max-width: 100%; }
table.t { border-collapse: collapse; width: 100%; font-size: .88rem; }
.t th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--mute); font-weight: 650; padding: 9px 14px; background: var(--surface2); border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; }
.t td { padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.t tbody tr:hover { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); } .t tbody tr:last-child td { border-bottom: 0; }
.t tfoot td { padding: 10px 14px; font-weight: 600; border-top: 2px solid var(--line2); background: var(--surface2); }
.t .num { text-align: right; } .t td.actions, .t th.actions { text-align: right; white-space: nowrap; width: 1%; } .t.compact td, .t.compact th { padding: 6px 12px; } .t td.low { color: var(--bad); font-weight: 600; }
.t td.due, .due { color: var(--bad); font-weight: 600; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; text-align: left; } .linkbtn:hover { text-decoration: underline; }
.cellinput { width: 88px; padding: 5px 8px; text-align: right; } td > .cellinput:not(.mono) { width: 100%; min-width: 110px; text-align: left; }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: var(--r-sm); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 5px 11px; font-size: .8rem; font-weight: 600; color: var(--mute); border-right: 1px solid var(--line); } .seg button:last-child { border-right: 0; } .seg button:hover:not(:disabled) { background: var(--surface2); }
.seg button.on { background: var(--accent); color: var(--accent-fg); } .seg button.on.ok { background: var(--ok); color: #fff; } .seg button.on.bad { background: var(--bad); color: #fff; } .seg button.on.warn { background: var(--warn); color: #fff; } .seg button.on.info { background: var(--info); color: #fff; } .seg button:disabled { cursor: not-allowed; opacity: .6; }
.legend { display: flex; gap: 16px; padding: 9px 14px; font-size: .78rem; color: var(--mute); border-bottom: 1px solid var(--line); flex-wrap: wrap; } .legend span { display: inline-flex; align-items: center; gap: 6px; }
.mcell { display: inline-block; width: 17px; height: 17px; border-radius: 4px; vertical-align: middle; background: var(--mute-soft); border: 1px dashed var(--line2); }
.mcell.ok { background: var(--ok); border: 0; } .mcell.part { background: linear-gradient(135deg, var(--warn) 50%, var(--warn-soft) 50%); border: 0; } .mcell.no { background: var(--bad); border: 0; }
.dues td, .dues th { padding-inline: 9px; } .dues td:first-child, .dues th:first-child { padding-left: 14px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 12px; padding: 14px; }
.note { border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); }
.note header { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; } .note h3 { font-family: var(--f-display); font-size: 1.02rem; display: flex; gap: 6px; align-items: center; color: var(--fg); } .note h3 svg { color: var(--brand); }
.note p { color: var(--mute); text-wrap: pretty; } .note footer { display: flex; justify-content: space-between; color: var(--faint); font-size: .78rem; } .note-actions { display: flex; justify-content: flex-end; margin-top: auto; }

/* ---------- Tableau de bord ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 2px; box-shadow: var(--shadow); min-width: 0; }
.kpi-top { display: flex; justify-content: space-between; color: var(--mute); font-size: .8rem; font-weight: 600; } .kpi strong { font-size: 1.65rem; line-height: 1.25; letter-spacing: -.03em; } .kpi small { color: var(--mute); font-size: .78rem; }
.kpi.warn strong { color: var(--warn); } .kpi.ok strong { color: var(--ok); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 16px; align-items: start; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
.chartwrap { overflow-x: auto; } .chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; } .chart .bar { fill: var(--accent); } .chart .bar.warn { fill: var(--warn); } .chart .val { fill: var(--fg); font-size: 11px; font-family: var(--f-mono); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; } .chart .lbl { fill: var(--mute); font-size: 10.5px; }
.chart .area { fill: var(--accent-soft); opacity: .8; } .chart .line { stroke: var(--accent); stroke-width: 2.2; stroke-linejoin: round; } .chart .dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.todo, .evlist, .rank, .facts { list-style: none; margin: 0; padding: 0; }
.todo li + li, .evlist li + li, .rank li + li, .facts li + li { border-top: 1px solid var(--line); }
.todo button { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: 0; padding: 9px 2px; text-align: left; color: var(--fg); } .todo button span:not(.badge) { flex: 1; } .todo button:hover { color: var(--accent); }
.evlist li { display: grid; grid-template-columns: 88px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; font-size: .9rem; }
.rank { counter-reset: r; } .rank li { display: flex; align-items: center; gap: 10px; padding: 8px 0; counter-increment: r; } .rank li::before { content: counter(r); width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: .75rem; font-weight: 700; flex: none; } .rank li span { flex: 1; min-width: 0; }
.facts li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; font-size: .9rem; } .facts li span { color: var(--mute); }
.scale summary { cursor: pointer; font-weight: 600; } .scale-row { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 12px; } .scale-row small { color: var(--mute); }

/* ---------- Calendrier ---------- */
.cal-head { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; } .cal-head strong { font-family: var(--f-display); font-size: 1.1rem; } .cal-head .icon-btn:first-of-type svg { transform: rotate(180deg); }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.cal-dow { background: var(--surface2); text-align: center; padding: 6px 0; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--mute); font-weight: 650; }
.cal-day { background: var(--surface); min-height: 78px; padding: 4px 5px; display: flex; flex-direction: column; gap: 2px; min-width: 0; } .cal-day.off { background: var(--surface2); } .cal-day.blank { background: var(--surface2); opacity: .6; }
.cal-day .n { font-size: .78rem; color: var(--mute); font-family: var(--f-mono); } .cal-day.today .n { background: var(--accent); color: var(--accent-fg); border-radius: 99px; width: 22px; height: 22px; display: grid; place-items: center; }
.ev { font-size: .68rem; line-height: 1.3; padding: 1px 5px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--mute-soft); color: var(--mute); font-weight: 600; }
.ev.ok { background: var(--ok-soft); color: var(--ok); } .ev.bad { background: var(--bad-soft); color: var(--bad); } .ev.warn { background: var(--warn-soft); color: var(--warn); } .ev.info { background: var(--info-soft); color: var(--info); } .more-ev { font-size: .66rem; color: var(--mute); }

function Modal({ title, onClose, children, wide, foot }) {

/* ---------- Champs de formulaire pilotés par configuration ---------- */
function Field({ f, values, set, db, error }) {
  const v = values[f.k], id = 'f-' + f.k;
  const c = { id, disabled: !!f.ro, 'aria-invalid': !!error };
  let input;
  if (f.t === 'area') input = html`<textarea ...${c} rows=${f.rows || 3} value=${v ?? ''} onChange=${e => set(f.k, e.target.value)}></textarea>`;
  else if (f.t === 'select' || f.t === 'ref') {
    let o;
    if (f.t === 'ref') o = db[f.ref].filter(r => !f.fl || f.fl(r, values, db)).map(r => ({ v: r.id, l: LABEL[f.ref](r, db) })).sort((a, b) => a.l.localeCompare(b.l, 'fr'));
    else o = (typeof f.o === 'function' ? f.o(values, db) : f.o).map(x => typeof x === 'string' ? { v: x, l: x } : x);
    input = html`<select ...${c} value=${v ?? ''} onChange=${e => set(f.k, e.target.value)}><option value="">—</option>${o.map(x => html`<option key=${x.v} value=${x.v}>${x.l}</option>`)}</select>`;
  }
  else if (f.t === 'bool') input = html`<label className="check"><input ...${c} type="checkbox" checked=${!!v} onChange=${e => set(f.k, e.target.checked)} /> <span>${f.cl || 'Oui'}</span></label>`;
  else if (f.t === 'num') input = html`<input ...${c} type="number" step=${f.step || 1} min=${f.min} max=${f.max} value=${v ?? ''} onChange=${e => set(f.k, e.target.value === '' ? '' : Number(e.target.value))} />`;
  else if (f.t === 'file') input = html`<div className="filepick"><input ...${c} type="file" onChange=${e => { const fl = e.target.files && e.target.files[0]; set(f.k, fl ? fl.name : v); }} />${v && html`<span className="mono small">${v}</span>`}</div>`;
  else {
    const list = f.list ? f.list(db) : null;
    input = html`<input ...${c} type=${f.t || 'text'} value=${v ?? ''} placeholder=${f.ph} list=${list ? id + '-l' : undefined} onChange=${e => set(f.k, e.target.value)} />${list && html`<datalist id=${id + '-l'}>${list.map(x => html`<option key=${x} value=${x} />`)}</datalist>`}`;
  }
  return html`<div className=${'field' + (f.w === 'full' || f.t === 'area' ? ' full' : '') + (error ? ' has-err' : '')}>
    <label htmlFor=${id}>${f.l}${f.req && html`<span className="req"> *</span>`}</label>${input}
    ${error ? html`<small className="err">${error}</small>` : f.hint && html`<small className="hint">${typeof f.hint === 'function' ? f.hint(values, db) : f.hint}</small>`}
  </div>`;
}
function validateFields(fields, values, db, editing) {
  const errs = {};
  fields.forEach(f => {
    if (f.show && !f.show(values)) return;
    const v = values[f.k];
    if (f.req && (v === '' || v === undefined || v === null)) { errs[f.k] = 'Champ obligatoire'; return; }
    if (f.t === 'num' && v !== '' && v !== undefined) { if (f.min !== undefined && v < f.min) { errs[f.k] = 'Minimum : ' + f.min; return; } if (f.max !== undefined && v > f.max) { errs[f.k] = 'Maximum : ' + f.max; return; } }
    if (f.t === 'email' && v && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) { errs[f.k] = 'Adresse e-mail invalide'; return; }
    if (f.check) { const m = f.check(v, values, db, editing); if (m) errs[f.k] = m; }
  });
  return errs;
}
function FormFields({ fields, values, set, db, errors }) {
  return html`<div className="form-grid">${fields.filter(f => !f.show || f.show(values)).map(f => html`<${Field} key=${f.k} f=${f} values=${values} set=${set} db=${db} error=${errors[f.k]} />`)}</div>`;
}

/* Boîte de dialogue générique : formulaire ou confirmation (remplace prompt/confirm) */
function AskDialog({ cfg, db, onDone }) {
  const [values, setValues] = useState(cfg.initial || {});
  const [errors, setErrors] = useState({});
  const [formErr, setFormErr] = useState('');
  const fields = cfg.fields || [];
  const set = (k, v) => setValues(prev => { let nv = { ...prev, [k]: v }; if (cfg.onChange) nv = { ...nv, ...(cfg.onChange(nv, k, db) || {}) }; return nv; });
  const submit = e => {
    if (e) e.preventDefault();
    const errs = validateFields(fields, values, db, cfg.editing); setErrors(errs);
    if (Object.keys(errs).length) return;
    const m = cfg.validate ? cfg.validate(values, db) : ''; if (m) { setFormErr(m); return; }
    onDone(values);
  };
  const foot = html`${cfg.secondary && html`<${Btn} tone=${cfg.secondary.tone || 'ghost'} onClick=${() => onDone({ __action: cfg.secondary.value })}>${cfg.secondary.l}<//>`}<span className="grow"></span>${!cfg.noCancel && html`<${Btn} onClick=${() => onDone(null)}>Annuler<//>`}<${Btn} tone=${cfg.danger ? 'danger solid' : 'primary'} onClick=${submit}>${cfg.submit || 'Enregistrer'}<//>`;
  return html`<${Modal} title=${cfg.title} onClose=${() => onDone(null)} wide=${cfg.wide} foot=${foot}>
    <form onSubmit=${submit}>
      ${cfg.message && html`<p className="dlg-msg">${cfg.message}</p>`}
      ${fields.length > 0 && html`<${FormFields} fields=${fields} values=${values} set=${set} db=${db} errors=${errors} />`}
      ${cfg.extra && cfg.extra(values, db)}
      ${formErr && html`<p className="form-err" role="alert">${formErr}</p>`}
      <button type="submit" hidden></button>
    </form></${Modal}>`;
}

/* ---------- Graphiques ---------- */
function Bars({ data, h = 150, fmt = num, label }) {
  const max = Math.max(1, ...data.map(d => d.v)), step = Math.max(46, 560 / Math.max(1, data.length)), w = step * data.length;
  return html`<div className="chartwrap"><svg viewBox=${`0 0 ${w} ${h + 28}`} className="chart" style=${{ minWidth: Math.min(w, 520) }} role="img" aria-label=${label || 'Histogramme'}>
    ${[0, .5, 1].map(t => html`<line key=${t} x1="0" x2=${w} y1=${h - t * (h - 16)} y2=${h - t * (h - 16)} className="grid" />`)}
    ${data.map((d, i) => { const bw = Math.min(30, step - 14), x = i * step + (step - bw) / 2, bh = d.v / max * (h - 18); return html`<g key=${i}><rect x=${x} y=${h - bh} width=${bw} height=${Math.max(bh, 1)} rx="3" className=${'bar ' + (d.tone || '')} /><text x=${x + bw / 2} y=${h - bh - 5} textAnchor="middle" className="val">${fmt(d.v)}</text><text x=${x + bw / 2} y=${h + 17} textAnchor="middle" className="lbl">${d.l}</text></g>`; })}
  </svg></div>`;
}
function Line({ data, h = 140, unit = '%', label }) {
  if (!data.length) return null;
  const w = 560, lo = Math.max(0, Math.floor(Math.min(...data.map(d => d.v)) - 6)), hi = 100, pl = 40, pr = 24, pt = 16, pb = 26;
  const X = i => pl + (data.length === 1 ? 0 : i * (w - pl - pr) / (data.length - 1)), Y = v => pt + (hi - v) / (hi - lo) * (h - pt - pb);
  const pts = data.map((d, i) => X(i) + ',' + Y(d.v)).join(' '), last = data[data.length - 1];
  return html`<div className="chartwrap"><svg viewBox=${`0 0 ${w} ${h}`} className="chart" role="img" aria-label=${label || 'Courbe'}>
    ${[lo, Math.round((lo + hi) / 2), hi].map(t => html`<g key=${t}><line x1=${pl} x2=${w - pr} y1=${Y(t)} y2=${Y(t)} className="grid" /><text x=${pl - 5} y=${Y(t) + 3} textAnchor="end" className="lbl">${t}${unit}</text></g>`)}
    <polygon points=${pl + ',' + Y(lo) + ' ' + pts + ' ' + X(data.length - 1) + ',' + Y(lo)} className="area" />
    <polyline points=${pts} className="line" fill="none" />
    ${data.map((d, i) => html`<text key=${i} x=${X(i)} y=${h - 8} textAnchor="middle" className="lbl">${d.l}</text>`)}
    <circle cx=${X(data.length - 1)} cy=${Y(last.v)} r="4" className="dot" />
    <text x=${X(data.length - 1)} y=${Y(last.v) - 9} textAnchor="end" className="val">${dec(last.v, 1)}${unit}</text>
  </svg></div>`;
}

function slaInfo(t) {
  if (t.statut === 'Résolu' || t.statut === 'Fermé') return { txt: 'Traité', tone: 'mute' };
  const d = new Date(t.cree).getTime() + SLA[t.priorite] * 3600e3 - Date.now(), h = Math.abs(d) / 3600e3;
  const f = h < 48 ? Math.max(1, Math.round(h)) + ' h' : Math.round(h / 24) + ' j';
  return d < 0 ? { txt: 'Dépassé de ' + f, tone: 'bad' } : { txt: 'Reste ' + f, tone: d < 6 * 3600e3 ? 'warn' : 'ok' };
}

  if (!d) return { txt: 'Sans échéance', tone: 'mute' };
  const n = daysTo(d);

function CrudPage({ cfg }) {

  rows = rows.filter(r => (cfg.filters || []).every(f => !flt[f.k] || r[f.k] === flt[f.k]));

  };
  const del = async row => {
    const ok = await ask({ title: 'Supprimer cet enregistrement ?', message: cfg.delMsg || 'Cette action est définitive.', submit: 'Supprimer', danger: true });
    if (!ok) return; await remove(table, [row.id]); notify('Enregistrement supprimé');

        ${(cfg.filters || []).map(f => {
    const o = f.t === 'ref' ? db[f.ref].map(r => ({ v: r.id, l: LABEL[f.ref](r, db) })).sort((a, b) => a.l.localeCompare(b.l, 'fr')) : (typeof f.o === 'function' ? f.o(db) : f.o).map(x => typeof x === 'string' ? { v: x, l: x } : x);
    return html`<select key=${f.k} id=${'flt-' + cfg.key + '-' + f.k} aria-label=${f.l} value=${flt[f.k] || ''} onChange=${e => { setFlt({ ...flt, [f.k]: e.target.value }); setLimit(60); }}><option value="">${f.l} : tous</option>${o.map(x => html`<option key=${x.v} value=${x.v}>${x.l}</option>`)}</select>`;
  })}
        <span className="grow"></span><span className="count">${rows.length} ${rows.length > 1 ? 'résultats' : 'résultat'}</span>
      </div>
      ${rows.length === 0 ? html`<${Empty} icon=${cfg.icon || 'file'} title="Aucun enregistrement">${q || Object.values(flt).some(Boolean) ? 'Aucun résultat pour ces critères.' : canEdit ? 'Utilisez le bouton « ' + cfg.nl + ' » pour commencer.' : 'Rien à afficher pour le moment.'}<//>`
      : cfg.card ? html`<div className="cards">${rows.slice(0, limit).map(r => html`<article key=${r.id} className="note">${cfg.card(r, db, app)}<div className="note-actions">${showActs && rowActs(r)}</div></article>`)}</div>`
        : html`<div className="tablewrap"><table className="t stack">
          <thead><tr>${cols.map((c, i) => html`<th key=${i} className=${c.num ? 'num' : ''}>${c.l}</th>`)}${showActs && html`<th className="actions"><span className="sr">Actions</span></th>`}</tr></thead>
          <tbody>${rows.slice(0, limit).map(r => html`<tr key=${r.id}>${cols.map((c, i) => html`<td key=${i} className=${(c.num ? 'num ' : '') + (c.mono ? 'mono' : '')} data-l=${c.l}>${c.r ? c.r(r, db, app) : (c.v(r, db) === '' || c.v(r, db) == null ? '—' : c.v(r, db))}</td>`)}${showActs && html`<td className="actions">${rowActs(r)}</td>`}</tr>`)}</tbody>
        </table></div>`}
      ${rows.length > limit && html`<div className="more"><${Btn} onClick=${() => setLimit(limit + 60)}>Afficher plus (${rows.length - limit} restants)<//></div>`}
    </div></section>`;
}

function MonthGrid() {

/* ---------- Résultats ---------- */
function computeResults(db, classId, session) {
  const exams = db.exams.filter(e => e.classId === classId && e.session === session);
  const rows = activeIn(db, classId).map(s => {
    let pts = 0, cf = 0; const notes = {};
    exams.forEach(e => {
      const m = db.marks.find(x => x.examId === e.id && x.studentId === s.id), sub = db.subjects.find(x => x.id === e.subjectId), c = sub ? sub.coef : 1;
      if (m && !m.abs && m.note !== '') { const n20 = m.note * 20 / (e.noteMax || 20); notes[e.subjectId] = n20; pts += n20 * c; cf += c; }
    });
    return { s, notes, moy: cf ? pts / cf : null };
  });
  const ranked = rows.filter(r => r.moy !== null).sort((a, b) => b.moy - a.moy);
  rows.forEach(r => { r.rang = r.moy === null ? null : ranked.findIndex(x => x.moy === r.moy) + 1; });
  return { exams, rows, ranked, subjects: [...new Set(exams.map(e => e.subjectId))].map(id => db.subjects.find(s => s.id === id)).filter(Boolean) };
}
const sessionsOf = (db, cid) => [...new Set(db.exams.filter(e => e.classId === cid).sort((a, b) => b.date.localeCompare(a.date)).map(e => e.session))];
const sessionsWithMarks = (db, cid) => sessionsOf(db, cid).filter(s => db.exams.some(e => e.classId === cid && e.session === s && db.marks.some(m => m.examId === e.id)));

/* ---------- Saisie des notes ---------- */
function MarksPage() {
  const app = useApp(); const { db, can, saveMany, notify } = app, edit = can('marks', 'edit');
  const classes = sortedClasses(db); const [cid, setCid] = useState((classes[0] || {}).id || ''); const [eid, setEid] = useState('');
  const exams = db.exams.filter(e => e.classId === cid).sort((a, b) => b.date.localeCompare(a.date) || a.session.localeCompare(b.session));
  const exam = exams.find(e => e.id === eid) || exams[0];
  const studs = activeIn(db, cid);
  const existing = useMemo(() => { const m = {}; if (exam) db.marks.filter(x => x.examId === exam.id).forEach(x => { m[x.studentId] = x; }); return m; }, [db.marks, exam && exam.id]);
  const [draft, setDraft] = useState({}), [err, setErr] = useState('');
  useEffect(() => { setDraft({}); setErr(''); }, [exam && exam.id]);
  const val = s => draft[s.id] || { note: existing[s.id] ? existing[s.id].note : '', abs: existing[s.id] ? existing[s.id].abs : false };
  const setV = (s, patch) => setDraft(d => ({ ...d, [s.id]: { ...val(s), ...patch } }));
  const max = exam ? exam.noteMax : 20;
  const vals = studs.map(s => ({ s, ...val(s) })), filled = vals.filter(v => !v.abs && v.note !== '' && !Number.isNaN(Number(v.note)));
  const stats = filled.length ? { avg: filled.reduce((a, v) => a + Number(v.note), 0) / filled.length, min: Math.min(...filled.map(v => Number(v.note))), max: Math.max(...filled.map(v => Number(v.note))), pass: filled.filter(v => Number(v.note) * 20 / max >= 10).length / filled.length * 100 } : null;
  const submit = async () => {
    const bad = vals.find(v => !v.abs && v.note !== '' && (Number(v.note) < 0 || Number(v.note) > max || Number.isNaN(Number(v.note))));
    if (bad) { setErr('La note de ' + fullName(bad.s) + ' doit être comprise entre 0 et ' + max + '.'); return; }
    setErr('');
    const rows = vals.filter(v => v.abs || v.note !== '' || existing[v.s.id]).map(v => ({ ...(existing[v.s.id] || {}), examId: exam.id, studentId: v.s.id, note: v.abs || v.note === '' ? '' : Number(v.note), abs: !!v.abs }));
    await saveMany('marks', rows); setDraft({}); notify(rows.length + ' notes enregistrées');
  };
  return html`<section>
    <${PageHead} title="Notes" sub="Saisie groupée des notes d’une épreuve. La mention est calculée automatiquement."><${Btn} tone="primary" icon="check" disabled=${!edit || !exam} onClick=${submit}>Enregistrer les notes<//><//>

const crud = k => function CrudView() { return html`<${CrudPage} cfg=${CFG[k]} />`; };

['students', 'parents', 'admissions', 'classes', 'subjects', 'teachers', 'assignments', 'users', 'exams', 'lessons', 'logbook', 'substitutes', 'conduct', 'activities', 'ptm', 'notices', 'events', 'tickets', 'documents', 'assets', 'maintenance', 'stock', 'stockTx', 'feeStructure', 'payments'].forEach(k => { PAGES[k] = crud(k); });

const can_ = (role, k, kind) => { const p = PERM[k]; if (!p) return false; return ((kind === 'edit' ? p.e : p.v) || []).includes(role); };

function Toasts({ list }) {
  return html`<div className="toasts" aria-live="polite">${list.map(t => html`<div key=${t.id} className=${'toast ' + (t.tone || '')} role="status">${t.msg}</div>`)}</div>`;
}

function LoginScreen({ info, onDone }) {
  const first = !info.hasUsers;
  const [v, setV] = useState({ email: '', nom: '', pwd: '', pwd2: '' }), [err, setErr] = useState(''), [busy, setBusy] = useState(false);
  const set = k => e => setV({ ...v, [k]: e.target.value });
  const submit = async e => {
    e.preventDefault(); setErr('');
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.email.trim())) { setErr('Saisissez une adresse e-mail valide.'); return; }
    if (first) { if (!v.nom.trim()) { setErr('Indiquez votre nom.'); return; } if (v.pwd.length < 8) { setErr('Le mot de passe doit contenir au moins 8 caractères.'); return; } if (v.pwd !== v.pwd2) { setErr('Les deux mots de passe ne correspondent pas.'); return; } }
    else if (!v.pwd) { setErr('Saisissez votre mot de passe.'); return; }
    setBusy(true);
    try { if (first) await Api.setup(v.email, v.nom, v.pwd); else await Api.login(v.email, v.pwd); onDone(); } catch (x) { setErr(x.message || String(x)); setBusy(false); }
  };
  return html`<div className="boot"><form className="boot-card login" onSubmit=${submit}>
    <div className="logo-mark">S</div><strong>${first ? 'Créer le compte de la direction' : 'Scolaria'}</strong>
    <p className="muted">${first ? 'Première utilisation : ce compte administrateur gérera les autres utilisateurs.' : (info.school || 'Connectez-vous pour accéder à la gestion de l’école.')}</p>
    ${first && html`<div className="field"><label htmlFor="lg-nom">Nom complet</label><input id="lg-nom" autoComplete="name" value=${v.nom} onChange=${set('nom')} /></div>`}
    <div className="field"><label htmlFor="lg-email">Adresse e-mail</label><input id="lg-email" type="email" autoComplete="username" value=${v.email} onChange=${set('email')} /></div>
    <div className="field"><label htmlFor="lg-pwd">Mot de passe</label><input id="lg-pwd" type="password" autoComplete=${first ? 'new-password' : 'current-password'} value=${v.pwd} onChange=${set('pwd')} /></div>
    ${first && html`<div className="field"><label htmlFor="lg-pwd2">Confirmer le mot de passe</label><input id="lg-pwd2" type="password" autoComplete="new-password" value=${v.pwd2} onChange=${set('pwd2')} /></div>`}
    ${err && html`<p className="form-err" role="alert">${err}</p>`}
    <${Btn} tone="primary" type="submit" disabled=${busy}>${busy ? 'Connexion…' : first ? 'Créer le compte' : 'Se connecter'}<//>
  </form></div>`;
}

function App() {
  const [boot, setBoot] = useState('loading'), [bootErr, setBootErr] = useState('');
  const [db, setDb] = useState(null), [me, setMe] = useState(null), [page, setPage] = useState(''), [dlg, setDlg] = useState(null), [toasts, setToasts] = useState([]), [menu, setMenu] = useState(false);
  const [theme, setTheme] = useState(() => { try { return localStorage.getItem('scolaria-theme') || ''; } catch (e) { return ''; } });
  const first = useRef(true), dbRef = useRef(null);
  dbRef.current = db;

  useEffect(() => {
    const el = document.documentElement; if (theme) el.setAttribute('data-theme', theme); else el.removeAttribute('data-theme');
    try { if (theme) localStorage.setItem('scolaria-theme', theme); else localStorage.removeItem('scolaria-theme'); } catch (e) { /* ignore */ }
  }, [theme]);
  const dark = theme ? theme === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);

  const [loginInfo, setLoginInfo] = useState({ hasUsers: true, school: '' });
  const enter = r => {
    setDb(r.db); setMe(r.me);
    setPage(home_(r.me.role)); setBoot('ok');
  };
  const toLogin = () => Api.status().then(i => { setLoginInfo(i); setBoot('login'); }).catch(e => { setBootErr(e.message || String(e)); setBoot('error'); });
  const load = useCallback(() => {
    setBoot('loading');
    if (IN_GAS && !Api.hasToken()) { toLogin(); return; }
    Api.load().then(r => { if (!r.me) { setDb(r.db); setBoot('denied'); return; } enter(r); })
      .catch(e => { if (IN_GAS && isAuthErr(e)) { setToken(''); toLogin(); return; } setBootErr(e.message || String(e)); setBoot('error'); });
  }, []);
  useEffect(() => { load(); }, [load]);
  useEffect(() => { if (IN_GAS || !db) return; if (first.current) { first.current = false; return; } lsSet(db); }, [db]);

  const go = useCallback(k => { setPage(k); setMenu(false); window.scrollTo(0, 0); }, []);
  const notify = useCallback((msg, tone) => { const id = uid(); setToasts(t => [...t, { id, msg, tone }]); setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), tone === 'bad' ? 6000 : 3200); }, []);
  const ask = useCallback(cfg => new Promise(res => setDlg({ cfg, res })), []);
  const closeDlg = v => { const d = dlg; setDlg(null); if (d) d.res(v); };

  const who = me ? me.nom : '';
  const audit = (action, table, rowId, detail) => ({ id: uid(), at: new Date().toISOString(), user: who, action, table, rowId, detail });
  const commit = fn => setDb(prev => fn(prev));
  const fail = e => { if (isAuthErr(e)) { setToken(''); notify('Votre session a expiré. Reconnectez-vous.', 'bad'); load(); return; } notify('Enregistrement impossible : ' + (e.message || e), 'bad'); load(); };
  const logout = async () => { await Api.logout(); setMe(null); setDb(null); load(); };

  const save = useCallback(async (table, row) => {
    const isNew = !row.id, r = normRow(table, { ...row, id: row.id || (table === 'settings' ? 'main' : uid()) });
    commit(prev => { const exist = prev[table].some(x => x.id === r.id); const next = { ...prev, [table]: exist ? prev[table].map(x => x.id === r.id ? r : x) : [...prev[table], r] }; if (!IN_GAS && table !== 'audit') next.audit = [...prev.audit, audit(isNew ? 'créé' : 'modifié', table, r.id, r.recu || r.nom || r.titre || r.session || '')]; return next; });
    if (IN_GAS) { try { await Api.save(table, r); } catch (e) { fail(e); } }
    return r;
  }, [who]);
  const saveMany = useCallback(async (table, rows) => {
    const rs = rows.map(x => normRow(table, { ...x, id: x.id || uid() }));
    commit(prev => { const m = new Map(rs.map(x => [x.id, x])); const kept = prev[table].map(x => m.has(x.id) ? m.get(x.id) : x), have = new Set(prev[table].map(x => x.id)); const next = { ...prev, [table]: [...kept, ...rs.filter(x => !have.has(x.id))] }; if (!IN_GAS && table !== 'audit') next.audit = [...prev.audit, audit('modifié', table, '', rs.length + ' lignes')]; return next; });
    if (IN_GAS) { try { await Api.saveMany(table, rs); } catch (e) { fail(e); } }

  }, [who]);
  const remove = useCallback(async (table, ids) => {
    commit(prev => { const next = { ...prev, [table]: prev[table].filter(x => !ids.includes(x.id)) }; if (!IN_GAS && table !== 'audit') next.audit = [...prev.audit, audit('supprimé', table, ids.join(','), ids.length + ' ligne(s)')]; return next; });
    if (IN_GAS) { try { await Api.remove(table, ids); } catch (e) { fail(e); } }
  }, [who]);
  const resetDemo = () => { lsClear(); first.current = true; Api.load(me.role).then(r => { setDb(r.db); setMe(r.db.users.find(u => u.role === me.role)); }); };
  const switchRole = role => { const u = db.users.find(x => x.role === role); if (!u) return; setMe(u); go(home_(role)); };

  if (boot === 'loading') return html`<div className="boot"><div className="boot-card"><div className="logo-mark">S</div><strong>Scolaria</strong><span className="muted">Chargement des données…</span><div className="loadbar"><i></i></div></div></div>`;
  if (boot === 'login') return html`<${LoginScreen} info=${loginInfo} onDone=${load} />`;
  if (boot === 'error') return html`<div className="boot"><div className="boot-card"><strong>Impossible de charger les données</strong><p className="muted">${bootErr}</p><${Btn} tone="primary" onClick=${load}>Réessayer<//></div></div>`;
  if (boot === 'denied') return html`<div className="boot"><div className="boot-card"><div className="logo-mark">S</div><strong>Accès non autorisé</strong><p className="muted">Votre compte Google n’est associé à aucun utilisateur de l’école. Demandez à la direction de vous ajouter dans « Utilisateurs et rôles ».</p></div></div>`;

  const can = (k, kind = 'view') => can_(me.role, k, kind);
  const app = { db, me, can, go, save, saveMany, remove, ask, notify, resetDemo };
  const cur = PAGES[page] && can(page, 'view') ? page : home_(me.role), Page = PAGES[cur], st = db.settings[0] || {};
  const badge = {
    admissions: db.admissions.filter(a => a.statut === 'En attente').length, tickets: db.tickets.filter(t => t.statut === 'Ouvert').length,
    complaints: can('complaints', 'edit') ? db.complaints.filter(c => c.statut === 'Nouvelle').length : 0, stock: db.stock.filter(s => stockQty(db, s) <= s.seuil).length,
    ptm: me.role === 'parent' ? db.ptm.filter(r => r.statut === 'Libre').length : 0

  const initials = (me.nom || '?').split(' ').map(w => w[0]).slice(0, 2).join('');

  return html`<${Ctx.Provider} value=${app}>
    <div className=${'shell' + (menu ? ' menu-open' : '')}>
      <aside className="side no-print" aria-label="Navigation principale">
        <div className="brand"><div className="logo-mark">S</div><div><strong>Scolaria</strong><small>${st.ecole}</small></div></div>
        <nav>${NAV.map(([g, items]) => { const vis = items.filter(([k]) => can(k, 'view')); return vis.length ? html`<div key=${g} className="grp"><h3>${g}</h3>${vis.map(([k, l, ic]) => html`<button type="button" key=${k} className=${'nav' + (cur === k ? ' on' : '')} aria-current=${cur === k ? 'page' : undefined} onClick=${() => go(k)}><${Icon} n=${ic} s=${17} /><span>${l}</span>${badge[k] > 0 && html`<b>${badge[k]}</b>`}</button>`)}</div>` : null; })}</nav>
        <div className="side-foot"><div className="avatar sm">${initials}</div><div className="grow"><strong>${me.nom}</strong><small>${ROLE_LABEL[me.role]}</small></div>${IN_GAS && html`<button type="button" className="icon-btn out" onClick=${logout} aria-label="Se déconnecter" title="Se déconnecter"><${Icon} n="x" s=${16} /></button>`}</div>
      </aside>
